name: Publish to npm

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gates
        run: npm run ci

      - name: Detect package version change
        id: version
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const cp = require("node:child_process");
          const outputFile = process.env.GITHUB_OUTPUT;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          let previousVersion = "";
          try {
            previousVersion = JSON.parse(
              cp.execSync("git show HEAD^:package.json", { encoding: "utf8" })
            ).version;
          } catch {
            previousVersion = "";
          }

          const changed = pkg.version !== previousVersion;

          fs.appendFileSync(outputFile, `name=${pkg.name}\n`);
          fs.appendFileSync(outputFile, `current=${pkg.version}\n`);
          fs.appendFileSync(outputFile, `previous=${previousVersion}\n`);
          fs.appendFileSync(outputFile, `changed=${changed}\n`);
          NODE

      - name: Check whether version already exists on npm
        id: npm
        if: steps.version.outputs.changed == 'true'
        run: |
          if npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.current }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.version.outputs.changed == 'true' && steps.npm.outputs.exists == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish summary
        if: steps.version.outputs.changed != 'true' || steps.npm.outputs.exists == 'true'
        run: |
          echo "Skip npm publish."
          echo "changed=${{ steps.version.outputs.changed }}"
          echo "already_exists=${{ steps.npm.outputs.exists || 'n/a' }}"
