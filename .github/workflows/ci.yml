name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build (minified)
        run: npm run build

      - name: Upload coverage artifact
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-22
          path: coverage
